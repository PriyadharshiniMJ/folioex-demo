big_losers = "Down more than {threshold} from what you paid: {symbols}."
big_winners = "Up more than {threshold} from what you paid: {symbols}."
idle_cash = "{weight} of your account ({amount}) is sitting in cash."
beat_benchmark = "You beat the {bench} by {pts} over {period}."
lag_benchmark = "You're {pts} behind the {bench} over {period}."
best_month = "Best month: {month} ({ret})."
worst_month = "Toughest month: {month} ({ret})."
dividend_share = "Dividends made up {share} of your gain over {period}."
dividend_growth = "Dividend income grew {change} in {year} compared with the year before."
dividend_drop = "Dividend income fell {change} in {year} compared with the year before."
fee_drag = "Tax and fees took {share} ({amount}) of your gains over {period}."
data_quality = "Heads up: {things} in your files may affect these numbers. The Data Hub lists what to check."
