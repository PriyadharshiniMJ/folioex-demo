[project]
name = "folioex"
version = "0.1.0"
description = "FolioEx: your portfolio, explained. A local U.S. stock portfolio analyzer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1",
    "dash-ag-grid>=35.3.0",
    "dash-bootstrap-components>=2.0.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
folioex = "folioex.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Hardlinks fail on this machine's cloud-synced user cache; copying is reliable everywhere.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["src/folioex"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", # Dash layout builders take many keyword arguments by design
    "PLR2004", # small literal thresholds in tests read better inline
    "RUF001",  # user-facing text intentionally uses typographic characters (− · …)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"src/folioex/ui/**" = ["PLR0917"]  # Dash passes callback inputs positionally
"tests/**" = ["PLC0415", "PLR0917"]  # builders mirror CSV columns

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["folioex"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[[tool.mypy.overrides]]
module = ["dash.*", "dash_bootstrap_components.*", "dash_ag_grid.*", "plotly.*", "yfinance.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Dash's callback decorators are untyped; the UI layer is thin wiring around typed analytics.
module = ["folioex.ui.*"]
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket -m 'not live'"
markers = [
    "live: needs the network (yfinance); excluded from the default run",
    "e2e: drives the app in a real browser with Playwright",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["folioex"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.0",
]
